version: 2

sources:
  - name: ga4_sample
    description: >
      Google Merchandise Store GA4 sample ecommerce events (obfuscated), public BigQuery dataset.
      Daily shards events_YYYYMMDD, 2020-11-01 to 2021-01-31. Location US.
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: "events_*"

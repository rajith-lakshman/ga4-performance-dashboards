name: ga4_dashboards
version: "0.1.0"
config-version: 2
profile: ga4_dashboards

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # GA4 sample ecommerce covers 2020-11-01 to 2021-01-31 (shard suffix format)
  start_date: "20201101"
  end_date: "20210131"

models:
  ga4_dashboards:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
